<div id="root"></div>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root{
    --bg:#0f1413;--panel:#161d1b;--panel2:#1c2522;--line:#2a3531;
    --ink:#e8efe9;--dim:#8aa097;
    --big:#f2c14e;--small:#6fb1c9;--pfand:#e07a5f;
    --good:#7bc47f;--avg:#e3b341;--bad:#e06c75;--accent:#2f6f5e;
    --pool:#5bb5c4;--terrace:#9ccb6a;--beer:#e0a44e;
  }
  *{box-sizing:border-box}
  #root{font-family:'IBM Plex Sans',sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%, rgba(47,111,94,.18), transparent 60%),var(--bg);
    color:var(--ink);min-height:100vh;padding:28px 22px 60px;line-height:1.45}
  .wrap{max-width:1240px;margin:0 auto}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:30px;letter-spacing:-.5px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:22px}
  .grid{display:grid;grid-template-columns:360px 1fr;gap:20px}
  @media(max-width:920px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
  .card h2{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--dim);margin:0 0 14px}
  label.field{display:block;margin-bottom:14px}
  .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
  .lab b{font-family:'IBM Plex Mono',monospace;font-weight:600}
  input[type=range]{width:100%;accent-color:var(--accent);height:4px}
  .seg{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap}
  .seg button{flex:1 1 0;min-width:58px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:7px 4px;border-radius:7px;cursor:pointer;transition:.15s}
  .manrow{display:flex;align-items:center;gap:6px;margin-top:6px}
  .manrow input{background:var(--panel2);border:1px solid var(--accent);color:var(--ink);border-radius:6px;
    padding:6px 8px;width:80px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px}
  .manrow span{font-family:'IBM Plex Mono',monospace;color:var(--dim);font-size:13px}
  .seg button.on.good{background:var(--good);border-color:var(--good);color:#0f1413}
  .seg button.on.avg{background:var(--avg);border-color:var(--avg);color:#0f1413}
  .seg button.on.bad{background:var(--bad);border-color:var(--bad);color:#0f1413}
  .scrow{margin-bottom:14px}
  .scrow .nm{font-size:13px;margin-bottom:5px;display:flex;justify-content:space-between}
  .scrow .nm small{color:var(--dim);font-family:'IBM Plex Mono',monospace}
  .mix{display:grid;grid-template-columns:1fr 56px;gap:8px;align-items:center;margin-bottom:8px}
  .mix span{font-size:13px}
  .mix input{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:6px;
    padding:5px;width:100%;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px}
  .warn{color:var(--bad);font-size:12px;margin-top:2px;min-height:14px}
  .ok{color:var(--good)}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:4px}
  @media(max-width:760px){.kpis{grid-template-columns:1fr}}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .kpi .t{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-family:'IBM Plex Mono',monospace}
  .kpi .v{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin-top:6px}
  .kpi .u{font-size:12px;color:var(--dim)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}
  td.mono,th.mono{font-family:'IBM Plex Mono',monospace}
  .pill{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:middle}
  .pb{background:var(--big)}.ps{background:var(--small)}.pp{background:var(--pfand)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .d-pool{background:var(--pool)}.d-terrace{background:var(--terrace)}.d-beer{background:var(--beer)}
  tr.tot td{font-weight:600;border-top:2px solid var(--line);border-bottom:none}
  .in{color:var(--good)}.out{color:var(--pfand)}
  .note{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.5}
  .sectitle{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin:6px 0 12px}
  .concl{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:760px){.concl{grid-template-columns:1fr}}
  .cwin{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
  .cwin .t{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-family:'IBM Plex Mono',monospace}
  .cwin .v{font-family:'Fraunces',serif;font-size:38px;font-weight:700;margin-top:10px;line-height:1}
  .cwin .u{font-size:13px;color:var(--dim);margin-top:8px}
</style>

<script type="module">
const $=(s)=>document.querySelector(s);
const root=document.getElementById('root');

const state={
  gMin:500,gMax:700,
  sc:{redeem:'avg',ret:'avg',inflight:'avg'},
  manual:{redeem:85,ret:80,inflight:30},
  buffer:15,
  avgPrice:4.53,
  itemsPerGuest:8,
  bars:{
    pool:{share:55,bottle:65,name:'Pool Bar'},
    terrace:{share:25,bottle:55,name:'Terrace Bar'},
    beer:{share:20,bottle:95,name:'Beer Bar'},
  },
};
const VAL={
  redeem:{good:0.92,avg:0.85,bad:0.72},
  ret:{good:0.95,avg:0.80,bad:0.60},
  inflight:{good:0.18,avg:0.30,bad:0.45},
};
// effective rate (0-1) for a variable: manual override if selected, else preset
function rate(varKey){
  if(state.sc[varKey]==='man') return Math.min(100,Math.max(0,+state.manual[varKey]||0))/100;
  return VAL[varKey][state.sc[varKey]];
}
const BIG=2.00,SMALL=0.50,PFANDV=1.00;
const PRICE_BOTTLE=4.30,PRICE_CUP=5.20;

// Demand-driven: total drinks = itemsPerGuest * guests. Spend = drinks * avgPrice.
// Cash loaded at Info Desk = spend / redemption (guests buy more tokens than they spend).
function eventDrinks(g){return state.itemsPerGuest*g;}

function computeBar(barKey,g){
  const b=state.bars[barKey];
  const ret=rate('ret'), inflight=rate('inflight');
  const barDrinks=eventDrinks(g)*(b.share/100);
  const bShare=b.bottle/100;
  const bottleDrinks=Math.round(barDrinks*bShare);
  const cupDrinks=Math.round(barDrinks*(1-bShare));
  const spent=barDrinks*state.avgPrice;
  const pfandOut=bottleDrinks;
  const pfandReturned=Math.round(bottleDrinks*ret);
  const pfandPeak=Math.ceil(bottleDrinks*inflight);
  const smallRefund=pfandReturned*2;
  return {spent,bottleDrinks,cupDrinks,total:bottleDrinks+cupDrinks,pfandOut,pfandReturned,pfandPeak,smallRefund};
}
function computeAll(g){
  const r={pool:computeBar('pool',g),terrace:computeBar('terrace',g),beer:computeBar('beer',g)};
  const redeem=rate('redeem');
  const spent=r.pool.spent+r.terrace.spent+r.beer.spent;     // token value actually spent on drinks
  const loaded=redeem>0 ? spent/redeem : spent;              // cash loaded at Info Desk (guests buy more than they spend)
  const valueBig=loaded*0.85, valueSmall=loaded*0.15;
  r.bigTokens=Math.round(valueBig/BIG); r.smallTokens=Math.round(valueSmall/SMALL);
  r.loaded=loaded; r.spent=spent;
  r.pfandPeakTotal=r.pool.pfandPeak+r.terrace.pfandPeak+r.beer.pfandPeak;
  r.totalDrinks=r.pool.total+r.terrace.total+r.beer.total;
  r.pfandOutTotal=r.pool.pfandOut+r.terrace.pfandOut+r.beer.pfandOut;
  r.pfandRetTotal=r.pool.pfandReturned+r.terrace.pfandReturned+r.beer.pfandReturned;
  r.smallRefundTotal=r.pool.smallRefund+r.terrace.smallRefund+r.beer.smallRefund;
  return r;
}
const fmt=n=>Math.round(n).toLocaleString('de-DE');
const eur=n=>'€'+Math.round(n).toLocaleString('de-DE');

function segHTML(varKey){
  const cur=state.sc[varKey];
  const btns=['good','avg','bad','man'].map(k=>{
    const lbl=k==='avg'?'Avg':k==='man'?'Manual':k[0].toUpperCase()+k.slice(1);
    const cls=cur===k?('on '+(k==='man'?'avg':k)):'';
    return `<button data-var="${varKey}" data-val="${k}" class="${cls}">${lbl}</button>`;
  }).join('');
  const manRow = cur==='man'
    ? `<div class="manrow"><input type="number" min="0" max="100" data-man="${varKey}" value="${state.manual[varKey]}"> <span>%</span></div>`
    : '';
  return `<div class="seg">${btns}</div>${manRow}`;
}

function render(){
  const hi=computeAll(state.gMax), lo=computeAll(state.gMin);
  const gMed=Math.round((state.gMin+state.gMax)/2);
  const md=computeAll(gMed);
  const mdBottles=md.pool.bottleDrinks+md.terrace.bottleDrinks+md.beer.bottleDrinks;
  const hiBottles=hi.pool.bottleDrinks+hi.terrace.bottleDrinks+hi.beer.bottleDrinks;
  const loBottles=lo.pool.bottleDrinks+lo.terrace.bottleDrinks+lo.beer.bottleDrinks;
  const barShareSum=state.bars.pool.share+state.bars.terrace.share+state.bars.beer.share;

  root.innerHTML=`<div class="wrap">
    <h1>Token Circulation Simulator</h1>
    <div class="sub">DWeb Camp 2026 · per-bar drink volumes, Pfand circulation &amp; token order quantities — Pool / Terrace / Beer</div>
    <div class="grid">
      <div>
        <div class="card">
          <h2>Guests</h2>
          <label class="field"><div class="lab"><span>Minimum</span><b>${state.gMin}</b></div>
            <input type="range" min="200" max="900" step="10" value="${state.gMin}" id="gMin"></label>
          <label class="field"><div class="lab"><span>Maximum</span><b>${state.gMax}</b></div>
            <input type="range" min="200" max="900" step="10" value="${state.gMax}" id="gMax"></label>
        </div>

        <div class="card">
          <h2>Scenario variables (independent)</h2>
          <div class="scrow"><div class="nm"><span>Redemption rate</span><small>${(rate('redeem')*100)|0}%</small></div>${segHTML('redeem')}</div>
          <div class="scrow"><div class="nm"><span>Pfand return rate</span><small>${(rate('ret')*100)|0}%</small></div>${segHTML('ret')}</div>
          <div class="scrow"><div class="nm"><span>Peak bottles in-flight</span><small>${(rate('inflight')*100)|0}%</small></div>${segHTML('inflight')}</div>
          <div class="note">Each runs independently — e.g. good redemption with bad returns.</div>
        </div>

        <div class="card">
          <h2>Demand</h2>
          <label class="field"><div class="lab"><span>Items per guest (whole event)</span><b>${state.itemsPerGuest}</b></div>
            <input type="range" min="1" max="25" step="1" value="${state.itemsPerGuest}" id="ipg"></label>
          <div class="mix" style="margin-top:4px"><span>Avg item price €</span><input type="number" step="0.01" id="avgPrice" value="${state.avgPrice}"></div>
          <div class="note">Default €4.53 = plain average of the 19 menu items (new prices). Total drinks = items/guest × guests.</div>
        </div>

        <div class="card">
          <h2>Per-bar volume &amp; bottle share</h2>
          ${Object.entries(state.bars).map(([k,b])=>`
            <label class="field"><div class="lab"><span><span class="dot d-${k}"></span>${b.name} — volume</span><b>${b.share}%</b></div>
              <input type="range" min="0" max="100" step="5" value="${b.share}" data-bar="${k}" data-prop="share"></label>
            <label class="field" style="margin-top:-6px"><div class="lab"><span style="color:var(--dim)">↳ bottle drinks</span><b>${b.bottle}%</b></div>
              <input type="range" min="0" max="100" step="5" value="${b.bottle}" data-bar="${k}" data-prop="bottle"></label>
          `).join('')}
          <div class="warn ${barShareSum===100?'ok':''}">${barShareSum===100?'✓ shares sum to 100%':'⚠ shares sum to '+barShareSum+'%'}</div>
        </div>

        <div class="card">
          <h2>Order buffer</h2>
          <label class="field" style="margin-bottom:4px"><div class="lab"><span>Safety buffer on order qty</span><b>${state.buffer}%</b></div>
            <input type="range" min="0" max="50" step="1" value="${state.buffer}" id="buffer"></label>
          <div class="note">Applied to all three token types in the order list below.</div>
        </div>
      </div>

      <div>
        <div class="kpis">
          <div class="kpi"><div class="t">Cash inflow</div><div class="v">${eur(lo.loaded)}–${eur(hi.loaded)}</div><div class="u">spend ÷ redemption</div></div>
          <div class="kpi"><div class="t">Drinks served</div><div class="v">${fmt(lo.totalDrinks)}–${fmt(hi.totalDrinks)}</div><div class="u">across 3 bars</div></div>
          <div class="kpi"><div class="t">Bottles served</div><div class="v">${fmt(loBottles)}–${fmt(hiBottles)}</div><div class="u">1 Pfand token handed out each</div></div>
        </div>

        <div class="sectitle">Per-bar breakdown — median (${gMed} guests)</div>
        <div class="card">
          <table>
            <thead><tr><th>Bar</th><th class="mono">Drinks</th><th class="mono">Bottle</th><th class="mono">Cup</th><th class="mono"><span class="pill pp"></span>Pfand out</th><th class="mono"><span class="pill pp"></span>Pfand to stock</th></tr></thead>
            <tbody>
              ${['pool','terrace','beer'].map(k=>{const c=md[k];return `<tr>
                <td><span class="dot d-${k}"></span>${state.bars[k].name}</td>
                <td class="mono">${fmt(c.total)}</td><td class="mono">${fmt(c.bottleDrinks)}</td><td class="mono">${fmt(c.cupDrinks)}</td>
                <td class="mono out">${fmt(c.pfandOut)}</td><td class="mono">${fmt(c.pfandPeak)}</td></tr>`}).join('')}
              <tr class="tot"><td>Total</td><td class="mono">${fmt(md.totalDrinks)}</td>
                <td class="mono">${fmt(mdBottles)}</td>
                <td class="mono">${fmt(md.pool.cupDrinks+md.terrace.cupDrinks+md.beer.cupDrinks)}</td>
                <td class="mono out">${fmt(md.pfandOutTotal)}</td>
                <td class="mono">${fmt(md.pfandPeakTotal)}</td></tr>
            </tbody>
          </table>
          <div class="note"><b>Pfand to stock</b> = peak bottles in-flight per bar = how many Pfand tokens each bar starts with / keeps replenished from the Return Station. <b>Bottle column total (${fmt(mdBottles)})</b> = total bottles served at median.</div>
        </div>

        <div class="sectitle">📦 Order list — what to buy (max guests, ${state.buffer}% buffer)</div>
        <div class="card">
          <table>
            <thead><tr><th>Token</th><th class="mono">Unit</th><th class="mono">Base qty</th><th class="mono">+ Buffer</th><th class="mono">Order qty</th></tr></thead>
            <tbody>
              ${[
                ['Big','pb','€2.00',hi.bigTokens,BIG],
                ['Small','ps','€0.50',hi.smallTokens,SMALL],
                ['Pfand','pp','deposit',hi.pfandPeakTotal,PFANDV],
              ].map(([nm,cls,unit,base,val])=>{
                const buf=base*(state.buffer/100);
                const order=Math.ceil(base+buf);
                return `<tr>
                  <td><span class="pill ${cls}"></span>${nm}</td>
                  <td class="mono">${unit}</td>
                  <td class="mono">${fmt(base)}</td>
                  <td class="mono" style="color:var(--dim)">+${fmt(buf)}</td>
                  <td class="mono" style="font-weight:600">${fmt(order)}</td>
                </tr>`;
              }).join('')}
              <tr class="tot"><td>Total pieces to order</td><td></td>
                <td class="mono">${fmt(hi.bigTokens+hi.smallTokens+hi.pfandPeakTotal)}</td>
                <td></td>
                <td class="mono">${fmt(Math.ceil(hi.bigTokens*(1+state.buffer/100))+Math.ceil(hi.smallTokens*(1+state.buffer/100))+Math.ceil(hi.pfandPeakTotal*(1+state.buffer/100)))}</td>
              </tr>
            </tbody>
          </table>
          <div class="note">Quantities are pieces of each physical token to print/buy, including the ${state.buffer}% safety buffer.</div>
        </div>

        <div class="sectitle">Final order — what to buy (max guests, ${state.buffer}% buffer)</div>
        <div class="concl">
          ${[
            ['Big tokens','pb','--big',Math.ceil(hi.bigTokens*(1+state.buffer/100)),'€2.00 each'],
            ['Small tokens','ps','--small',Math.ceil(hi.smallTokens*(1+state.buffer/100)),'€0.50 each'],
            ['Pfand tokens','pp','--pfand',Math.ceil(hi.pfandPeakTotal*(1+state.buffer/100)),'deposit'],
          ].map(([nm,cls,cssvar,qty,sub])=>`
            <div class="cwin" style="border-top:3px solid var(${cssvar})">
              <div class="t"><span class="pill ${cls}"></span>${nm}</div>
              <div class="v" style="color:var(${cssvar})">${fmt(qty)}</div>
              <div class="u">order qty · ${sub}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;

  $('#gMin').oninput=e=>{state.gMin=+e.target.value;if(state.gMin>state.gMax)state.gMax=state.gMin;render();};
  $('#gMax').oninput=e=>{state.gMax=+e.target.value;if(state.gMax<state.gMin)state.gMin=state.gMax;render();};
  const bufEl=$('#buffer'); if(bufEl) bufEl.oninput=e=>{state.buffer=+e.target.value;render();};
  document.querySelectorAll('[data-var]').forEach(b=>b.onclick=()=>{state.sc[b.dataset.var]=b.dataset.val;render();});
  document.querySelectorAll('[data-man]').forEach(inp=>inp.oninput=e=>{
    const k=e.target.dataset.man; state.manual[k]=+e.target.value;
    const pos=e.target.selectionStart;
    render();
    const again=document.querySelector('[data-man="'+k+'"]');
    if(again){again.focus(); try{again.setSelectionRange(pos,pos);}catch(_){}}
  });
  const ipgEl=$('#ipg'); if(ipgEl) ipgEl.oninput=e=>{state.itemsPerGuest=+e.target.value;render();};
  const apEl=$('#avgPrice'); if(apEl) apEl.onchange=e=>{state.avgPrice=+e.target.value||0;render();};
  document.querySelectorAll('[data-bar]').forEach(r=>r.oninput=e=>{state.bars[e.target.dataset.bar][e.target.dataset.prop]=+e.target.value;render();});
}
render();
</script>
