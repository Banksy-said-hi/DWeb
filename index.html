<div id="root"></div>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root{
    --bg:#0f1413;--panel:#161d1b;--panel2:#1c2522;--line:#2a3531;
    --ink:#f2f7f3;--dim:#9fb3aa;
    --big:#f2c14e;--small:#6fb1c9;--pfand:#e07a5f;
    --good:#7bc47f;--avg:#e3b341;--bad:#e06c75;--accent:#2f6f5e;
  }
  *{box-sizing:border-box}
  #root{font-family:'IBM Plex Sans',sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%, rgba(47,111,94,.18), transparent 60%),var(--bg);
    color:var(--ink);min-height:100vh;padding:28px 22px 60px;line-height:1.45}
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:30px;letter-spacing:-.5px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:22px}
  .grid{display:grid;grid-template-columns:360px 1fr;gap:20px}
  @media(max-width:920px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
  .card h2{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--dim);margin:0 0 14px}
  label.field{display:block;margin-bottom:14px}
  .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
  .lab b{font-family:'IBM Plex Mono',monospace;font-weight:600}
  input[type=range]{width:100%;accent-color:var(--accent);height:4px}
  .seg{display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap}
  .seg button{flex:1 1 0;min-width:58px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:7px 4px;border-radius:7px;cursor:pointer;transition:.15s}
  .seg button.on.good{background:var(--good);border-color:var(--good);color:#0f1413}
  .seg button.on.avg{background:var(--avg);border-color:var(--avg);color:#0f1413}
  .seg button.on.bad{background:var(--bad);border-color:var(--bad);color:#0f1413}
  .manrow{display:flex;align-items:center;gap:6px;margin-top:6px}
  .manrow input{background:var(--panel2);border:1px solid var(--accent);color:var(--ink);border-radius:6px;
    padding:6px 8px;width:80px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px}
  .manrow span{font-family:'IBM Plex Mono',monospace;color:var(--dim);font-size:13px}
  .scrow{margin-bottom:14px}
  .scrow .nm{font-size:13px;margin-bottom:5px;display:flex;justify-content:space-between}
  .scrow .nm small{color:var(--dim);font-family:'IBM Plex Mono',monospace}
  .mix{display:grid;grid-template-columns:1fr 56px;gap:8px;align-items:center;margin-bottom:8px}
  .mix span{font-size:13px}
  .mix input{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:6px;
    padding:5px;width:100%;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px}
  .note{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.5}
  .fml{margin-top:4px;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.7}
  .fml .row{display:flex;gap:8px;color:var(--ink)}
  .fml .row b{color:var(--dim);font-weight:600;min-width:104px;display:inline-block}
  .fml .eq{color:#9fc7b8}
  details.what{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  details.what summary{cursor:pointer;font-size:12px;color:var(--accent);font-family:'IBM Plex Mono',monospace;letter-spacing:.3px;list-style:none}
  details.what summary::-webkit-details-marker{display:none}
  details.what summary::before{content:'▸ ';color:var(--accent)}
  details.what[open] summary::before{content:'▾ '}
  details.what .body{font-size:12px;color:var(--dim);line-height:1.55;margin-top:8px}
  details.what .body p{margin:0 0 7px}
  .scrow details.what,label.field+details.what{border-top:none;padding-top:4px;margin-top:6px}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
  @media(max-width:760px){.kpis{grid-template-columns:1fr}}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .kpi .t{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-family:'IBM Plex Mono',monospace}
  .kpi .v{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin-top:6px}
  .kpi .u{font-size:12px;color:var(--dim)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:right;padding:10px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  td{color:#fff;font-weight:500}
  tbody tr:nth-child(even) td{background:rgba(255,255,255,.035)}
  th{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:#aebfb6}
  td.mono,th.mono{font-family:'IBM Plex Mono',monospace}
  .pill{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:middle}
  .pb{background:var(--big)}.ps{background:var(--small)}.pp{background:var(--pfand)}
  tr.tot td{font-weight:600;border-top:2px solid var(--line);border-bottom:none}
  .sectitle{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin:6px 0 12px}
  .concl{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:760px){.concl{grid-template-columns:1fr}}
  .cwin{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
  .cwin .t{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-family:'IBM Plex Mono',monospace}
  .cwin .v{font-family:'Fraunces',serif;font-size:38px;font-weight:700;margin-top:10px;line-height:1}
  .cwin .u{font-size:13px;color:var(--dim);margin-top:8px}
</style>

<script type="module">
const $=(s)=>document.querySelector(s);
const root=document.getElementById('root');

const state={
  gMin:500,gMax:700,
  sc:{ret:'avg',inflight:'avg'},
  manual:{ret:80,inflight:30},
  buffer:15,
  avgPrice:4.53,
  itemsPerGuest:8,
  bottleShare:70,   // single overall bottle-vs-cup %
  bigValueShare:85, // % of cash value dispensed as Big tokens (rest as Small)
};
const VAL={
  ret:{good:0.95,avg:0.80,bad:0.60},
  inflight:{good:0.18,avg:0.30,bad:0.45},
};
function rate(k){
  if(state.sc[k]==='man') return Math.min(100,Math.max(0,+state.manual[k]||0))/100;
  return VAL[k][state.sc[k]];
}
const BIG=2.00,SMALL=0.50,PFANDV=1.00;

function compute(g){
  const inflight=rate('inflight');
  const drinks=state.itemsPerGuest*g;
  const bottle=Math.round(drinks*state.bottleShare/100);
  const cup=drinks-bottle;
  const spend=drinks*state.avgPrice;            // cash inflow (no redemption gross-up)
  const pfandPeak=Math.ceil(bottle*inflight);   // tokens to own = peak in-flight
  const bs=state.bigValueShare/100;
  const bigTokens=Math.round(spend*bs/BIG);
  const smallTokens=Math.round(spend*(1-bs)/SMALL);
  return {drinks,bottle,cup,spend,pfandPeak,bigTokens,smallTokens};
}
const fmt=n=>Math.round(n).toLocaleString('de-DE');
const eur=n=>'€'+Math.round(n).toLocaleString('de-DE');

function wh(text){
  return `<details class="what"><summary>What is this?</summary><div class="body"><p>${text}</p></div></details>`;
}
function segHTML(varKey){
  const cur=state.sc[varKey];
  const btns=['good','avg','bad','man'].map(k=>{
    const lbl=k==='avg'?'Avg':k==='man'?'Manual':k[0].toUpperCase()+k.slice(1);
    const cls=cur===k?('on '+(k==='man'?'avg':k)):'';
    return `<button data-var="${varKey}" data-val="${k}" class="${cls}">${lbl}</button>`;
  }).join('');
  const manRow = cur==='man'
    ? `<div class="manrow"><input type="number" min="0" max="100" data-man="${varKey}" value="${state.manual[varKey]}"> <span>%</span></div>`
    : '';
  return `<div class="seg">${btns}</div>${manRow}`;
}

function render(){
  const lo=compute(state.gMin), hi=compute(state.gMax);
  const buf=k=>Math.ceil(k*(1+state.buffer/100));

  root.innerHTML=`<div class="wrap">
    <h1>Token Order Simulator</h1>
    <div class="sub">DWeb Camp 2026 · how many of each token to order — Big, Small, Pfand (all bars combined)</div>
    <div class="grid">
      <div>
        <div class="card">
          <h2>Guests</h2>
          <label class="field"><div class="lab"><span>Minimum</span><b>${state.gMin}</b></div>
            <input type="range" min="200" max="900" step="10" value="${state.gMin}" id="gMin"></label>
          <label class="field"><div class="lab"><span>Maximum</span><b>${state.gMax}</b></div>
            <input type="range" min="200" max="900" step="10" value="${state.gMax}" id="gMax"></label>
          ${wh('Expected attendance range for the camp. Every result is shown across this range; order quantities use the maximum, so you provision for the busiest realistic turnout.')}
        </div>

        <div class="card">
          <h2>Demand</h2>
          <label class="field"><div class="lab"><span>Items per guest (whole event)</span><b>${state.itemsPerGuest}</b></div>
            <input type="range" min="1" max="25" step="1" value="${state.itemsPerGuest}" id="ipg"></label>
          ${wh('Average number of drinks one guest buys across the entire event (all days combined). Total drinks = items/guest × guests. This is the main demand lever — raise it and everything scales up.')}
          <div class="mix" style="margin-top:8px"><span>Avg item price €</span><input type="number" step="0.01" id="avgPrice" value="${state.avgPrice}"></div>
          ${wh('Average price of one menu item. Default €4.53 is the plain average of all 19 menu items at current prices. Drives cash inflow = drinks × this price.')}
          <label class="field" style="margin-top:8px"><div class="lab"><span>Bottle drinks share</span><b>${state.bottleShare}%</b></div>
            <input type="range" min="0" max="100" step="5" value="${state.bottleShare}" id="bottleShare"></label>
          ${wh('Of all drinks sold, the share served in bottles (vs poured into cups). Only bottle drinks carry a Pfand deposit, so this sets how many Pfand tokens circulate.')}
          <label class="field" style="margin-top:8px"><div class="lab"><span>Value dispensed as Big tokens</span><b>${state.bigValueShare}%</b></div>
            <input type="range" min="50" max="100" step="5" value="${state.bigValueShare}" id="bigValueShare"></label>
          ${wh('How you hand out token value at the Info Desk: the share given as €2 Big tokens vs €0.50 Small tokens. More Big = fewer pieces to print but less change flexibility; more Small = easier change but many more pieces.')}
        </div>

        <div class="card">
          <h2>Scenario variables</h2>
          <div class="scrow"><div class="nm"><span>Pfand return rate</span><small>${(rate('ret')*100)|0}%</small></div>${segHTML('ret')}
            ${wh('Share of sold bottles guests bring back for the €1 refund. Unreturned deposits stay unclaimed (a bonus you keep). Drives the small-token refund load at the Return Station; informational for the order.')}</div>
          <div class="scrow"><div class="nm"><span>Peak bottles in-flight</span><small>${(rate('inflight')*100)|0}%</small></div>${segHTML('inflight')}
            ${wh('At the single busiest moment, the fraction of all sold bottles that are out at once (bought, not yet returned). This sizes the Pfand order — you only need enough tokens to cover that peak, since they cycle back through the Return Station and get reused.')}</div>
        </div>

        <div class="card">
          <h2>Order buffer</h2>
          <label class="field" style="margin-bottom:4px"><div class="lab"><span>Safety buffer on order qty</span><b>${state.buffer}%</b></div>
            <input type="range" min="0" max="50" step="1" value="${state.buffer}" id="buffer"></label>
          ${wh('Extra margin added on top of every calculated quantity before ordering — covers miscounts, damaged tokens, and demand running hotter than modelled. Applied to all three token types.')}
        </div>
      </div>

      <div>
        <div class="kpis">
          <div class="kpi"><div class="t">Cash inflow</div><div class="v">${eur(lo.spend)}–${eur(hi.spend)}</div><div class="u">= drinks × €${state.avgPrice.toFixed(2)}</div></div>
          <div class="kpi"><div class="t">Drinks served</div><div class="v">${fmt(lo.drinks)}–${fmt(hi.drinks)}</div><div class="u">= ${state.itemsPerGuest} items × guests</div></div>
          <div class="kpi"><div class="t">Bottles served</div><div class="v">${fmt(lo.bottle)}–${fmt(hi.bottle)}</div><div class="u">1 Pfand token handed out each</div></div>
        </div>

        <div class="sectitle">📦 Order list — what to buy (max guests, ${state.buffer}% buffer)</div>
        <div class="card">
          <table>
            <thead><tr><th>Token</th><th class="mono">Unit</th><th class="mono">Base qty</th><th class="mono">+ Buffer</th><th class="mono">Order qty</th></tr></thead>
            <tbody>
              ${[['Big','pb','€2.00',hi.bigTokens],['Small','ps','€0.50',hi.smallTokens],['Pfand','pp','deposit',hi.pfandPeak]].map(([nm,cls,unit,base])=>{
                const b=base*state.buffer/100, order=Math.ceil(base+b);
                return `<tr><td><span class="pill ${cls}"></span>${nm}</td><td class="mono">${unit}</td>
                  <td class="mono">${fmt(base)}</td><td class="mono" style="color:var(--dim)">+${fmt(b)}</td>
                  <td class="mono" style="font-weight:600">${fmt(order)}</td></tr>`;
              }).join('')}
              <tr class="tot"><td>Total pieces</td><td></td>
                <td class="mono">${fmt(hi.bigTokens+hi.smallTokens+hi.pfandPeak)}</td><td></td>
                <td class="mono">${fmt(buf(hi.bigTokens)+buf(hi.smallTokens)+buf(hi.pfandPeak))}</td></tr>
            </tbody>
          </table>
          <div class="fml">
            <div class="row"><b>Big base</b><span><span class="eq">=</span> cash inflow × ${state.bigValueShare}% ÷ €2.00</span></div>
            <div class="row"><b>Small base</b><span><span class="eq">=</span> cash inflow × ${100-state.bigValueShare}% ÷ €0.50</span></div>
            <div class="row"><b>Pfand base</b><span><span class="eq">=</span> bottles × peak-in-flight% (${(rate('inflight')*100)|0}%)</span></div>
            <div class="row"><b>Order qty</b><span><span class="eq">=</span> ⌈ base × (1 + ${state.buffer}%) ⌉</span></div>
          </div>
          <details class="what"><summary>What is this?</summary><div class="body">
            <p>Cash collected converts into physical tokens — most value in Big, a slice in Small for change. Pfand is ordered against peak circulation, not total bottles: tokens cycle back through the Return Station and get reused, so you only need enough to cover the busiest single moment.</p>
            <p>Order qty applies the ${state.buffer}% safety buffer and rounds up to whole pieces.</p>
          </div></details>
        </div>

        <div class="sectitle">Final order — what to buy (max guests, ${state.buffer}% buffer)</div>
        <div class="concl">
          ${[['Big tokens','pb','--big',buf(hi.bigTokens),'€2.00 each'],
             ['Small tokens','ps','--small',buf(hi.smallTokens),'€0.50 each'],
             ['Pfand tokens','pp','--pfand',buf(hi.pfandPeak),'deposit']].map(([nm,cls,cv,qty,sub])=>`
            <div class="cwin" style="border-top:3px solid var(${cv})">
              <div class="t"><span class="pill ${cls}"></span>${nm}</div>
              <div class="v" style="color:var(${cv})">${fmt(qty)}</div>
              <div class="u">order qty · ${sub}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;

  $('#gMin').oninput=e=>{state.gMin=+e.target.value;if(state.gMin>state.gMax)state.gMax=state.gMin;render();};
  $('#gMax').oninput=e=>{state.gMax=+e.target.value;if(state.gMax<state.gMin)state.gMin=state.gMax;render();};
  $('#ipg').oninput=e=>{state.itemsPerGuest=+e.target.value;render();};
  $('#bottleShare').oninput=e=>{state.bottleShare=+e.target.value;render();};
  $('#bigValueShare').oninput=e=>{state.bigValueShare=+e.target.value;render();};
  $('#buffer').oninput=e=>{state.buffer=+e.target.value;render();};
  $('#avgPrice').onchange=e=>{state.avgPrice=+e.target.value||0;render();};
  document.querySelectorAll('[data-var]').forEach(b=>b.onclick=()=>{state.sc[b.dataset.var]=b.dataset.val;render();});
  document.querySelectorAll('[data-man]').forEach(inp=>inp.oninput=e=>{
    const k=e.target.dataset.man; state.manual[k]=+e.target.value;
    const pos=e.target.selectionStart; render();
    const again=document.querySelector('[data-man="'+k+'"]');
    if(again){again.focus(); try{again.setSelectionRange(pos,pos);}catch(_){}}
  });
}
render();
</script>
